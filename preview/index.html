<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fainal Fantasy RTS: Skyfront Preview</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0c11c2;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(#002e98, #0c11c2 48%, #000 48%, #000 100%);
      }
      main {
        width: min(100vw, 1024px);
        display: grid;
        gap: 10px;
        justify-items: center;
      }
      canvas {
        width: min(100vw - 24px, 1024px);
        aspect-ratio: 256 / 240;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        border: 4px solid #b6b6b6;
        box-shadow: 0 0 0 4px #000, 0 10px 28px #000a;
      }
      .pad {
        color: #fff;
        font-size: 12px;
        opacity: 0.82;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="256" height="240" aria-label="Fainal Fantasy RTS playable preview"></canvas>
      <div class="pad">ARROWS: select route/command / Z or Enter: A / X or Backspace: B / Space: START</div>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
